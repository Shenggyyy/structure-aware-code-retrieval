name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows filesystem-heavy QA/archive tests need more than 15 minutes.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            timeout_minutes: 15
          - os: windows-latest
            timeout_minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked dependencies and Python
        run: uv sync --locked --dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check browser JavaScript runtime and syntax
        run: |
          node --version
          node --check src/structure_aware_retrieval/workbench/static/i18n.js
          node --check src/structure_aware_retrieval/workbench/static/app.js
      - name: Test
        # Report the first failure before a later timeout can hide its traceback.
        run: >-
          uv run --locked pytest -vv --maxfail=1 --tb=short --durations=20
          -o faulthandler_timeout=120
          --cov --cov-report=term-missing --cov-report=xml
      - name: Validate published retrieval overview
        run: uv run --locked python scripts/summarize_results.py --output reports/overview --check
      - name: Build distributions
        run: uv build

  containers:
    name: CPU container / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [base, dense]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build locked runtime image
        run: docker build --target "${{ matrix.target }}" --tag sacr:ci .
      - name: Check installed runtime and optional CPU dependencies
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /app/artifacts:rw,uid=10001,gid=10001,size=128m \
            --entrypoint python -e IMAGE_TARGET sacr:ci -c '
          import importlib.util, os
          from importlib.resources import files
          from pathlib import Path
          import structure_aware_retrieval
          import fastapi, uvicorn
          assert os.getuid() == 10001
          assert str(Path(structure_aware_retrieval.__file__).resolve()).startswith("/opt/venv/")
          assert importlib.util.find_spec("pytest") is None
          static = files("structure_aware_retrieval.workbench").joinpath("static")
          assert all(static.joinpath(name).is_file() for name in ("index.html", "app.js", "i18n.js", "app.css"))
          if os.environ["IMAGE_TARGET"] == "dense":
              import torch, sentence_transformers
              assert torch.version.cuda is None
              assert not torch.cuda.is_available()
          else:
              assert importlib.util.find_spec("torch") is None
              assert importlib.util.find_spec("sentence_transformers") is None
          '
      - name: Check installed workbench HTTP routes and packaged assets
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --entrypoint python sacr:ci scripts/smoke_workbench.py --require-installed
      - name: Exercise the installed CLI with networking disabled
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /app/artifacts:rw,uid=10001,gid=10001,size=128m \
            --entrypoint python sacr:ci scripts/smoke.py --output artifacts/smoke
