[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "structure-aware-code-retrieval"
version = "0.1.0"
description = "Code retrieval and evaluation for repository-level LLM applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
sacr = "structure_aware_retrieval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/structure_aware_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.coverage.run]
source = ["structure_aware_retrieval"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
