[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "structure-aware-code-retrieval"
version = "0.1.0"
description = "Code retrieval and evaluation for repository-level LLM applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pathspec>=0.12,<2",
    "rank-bm25>=0.2.2,<0.3",
    "typer>=0.16,<1",
    "uvicorn>=0.52.4,<0.53",
]

[project.scripts]
sacr = "structure_aware_retrieval.cli:app"

[project.optional-dependencies]
dense = ["sentence-transformers>=5.7,<6", "torch>=2.6,<3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/structure_aware_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.coverage.run]
source = ["structure_aware_retrieval"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
